<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="app-build" content="20260804-1745">
<meta name="theme-color" content="#0B1F17">
<title>RemindMe — நினைவூட்டல்</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1F17;
  --card:#132D22;
  --card2:#1B3A2C;
  --line:#234A38;
  --green:#22C55E;
  --green-dim:#16A34A;
  --amber:#FFC107;
  --red:#FF4D4D;
  --white:#FFFFFF;
  --muted:#A8C5B5;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--white);
  font-family:'Poppins','Noto Sans Tamil',system-ui,sans-serif;
  font-size:15px;line-height:1.55;overflow-x:hidden;width:100%;}
body{padding-bottom:112px;}
button,input,select,textarea{font-family:inherit;font-size:15px;}
button{cursor:pointer;}
a{color:var(--green);}

/* ---------- layout ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 14px;}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);
  padding:14px 14px 10px;border-bottom:1px solid var(--line);}
.topbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.brand{font-size:19px;font-weight:700;letter-spacing:.2px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar-in{gap:8px;}
@media (max-width:360px){
  .brand{font-size:17px;}
  .icon-btn{width:34px;height:34px;font-size:15px;}
  .topbar-in{gap:6px;}
}
.brand span{color:var(--green);}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--white);
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:17px;flex:0 0 auto;}

/* ---------- ticker ---------- */
.ticker{background:var(--card2);border-bottom:1px solid var(--line);
  overflow:hidden;white-space:nowrap;padding:7px 0;font-size:13px;color:var(--amber);display:none;}
.ticker.on{display:block;}
.ticker span{display:inline-block;padding-left:100%;animation:tick 18s linear infinite;}
@keyframes tick{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;margin:18px 0 10px;}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:14px;}
.stat{background:#000;border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 8px;text-align:center;min-width:0;}
.stat b{display:block;font-size:17px;font-weight:700;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;}
.stat small{display:block;font-size:10.5px;line-height:1.3;color:var(--white);
  margin-top:4px;overflow:hidden;white-space:pre-line;}
.s-green b{color:var(--green);} .s-amber b{color:var(--amber);} .s-red b{color:var(--red);}

/* ---------- reminder row ---------- */
.row{display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:var(--radius);padding:12px;margin-bottom:9px;}
.row.due-soon{border-left-color:var(--amber);}
.row.overdue{border-left-color:var(--red);}
.row.ok{border-left-color:var(--green);}
.row-emoji{width:40px;height:40px;border-radius:11px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
.row-mid{flex:1;min-width:0;}
.row-mid b{display:block;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-mid small{display:block;font-size:12px;line-height:1.35;color:var(--muted);
  margin-top:2px;overflow:hidden;white-space:pre-line;}
.row-right{text-align:right;flex:0 0 auto;max-width:40%;}
.row-right b{display:block;font-size:14.5px;font-weight:600;}
.row-right small{display:block;font-size:11px;line-height:1.3;margin-top:2px;white-space:pre-line;}
.t-red{color:var(--red)!important;} .t-amber{color:var(--amber)!important;}
.t-green{color:var(--green)!important;} .t-muted{color:var(--muted)!important;}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;
  font-size:15.5px;font-weight:600;margin-bottom:10px;text-align:center;}
.btn-primary{background:var(--green);color:#04150C;}
.btn-amber{background:var(--amber);color:#221A00;}
.btn-ghost{background:transparent;color:var(--white);border:1px solid var(--line);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-sm{padding:9px 13px;font-size:13.5px;width:auto;display:inline-block;margin:0;}
.btn:disabled{opacity:.5;}

/* ---------- form ---------- */
label.fl{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:500;}
label.fl:first-child{margin-top:0;}
.in{width:100%;padding:13px;background:var(--card2);border:1px solid var(--line);
  border-radius:11px;color:var(--white);outline:none;}
.in:focus{border-color:var(--green);}
textarea.in{min-height:74px;resize:vertical;}
select.in{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='%23A8C5B5'><path d='M7 10L2 4h10z'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center;padding-right:36px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:9px 13px;border-radius:20px;background:var(--card2);
  border:1px solid var(--line);font-size:13px;color:var(--muted);}
.chip.on{background:var(--green);border-color:var(--green);color:#04150C;font-weight:600;}
.chip.on-amber{background:var(--amber);border-color:var(--amber);color:#221A00;font-weight:600;}

/* category grid */
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.catcell{background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:12px 6px;text-align:center;min-width:0;}
.catcell.on{border-color:var(--green);background:#123626;}
.catcell i{display:block;font-size:23px;font-style:normal;}
.catcell span{display:block;font-size:11.5px;margin-top:5px;color:var(--muted);
  overflow:hidden;line-height:1.35;}
.catcell span em{display:block;font-style:normal;font-size:10.5px;opacity:.78;}
.catcell.on span{color:var(--white);}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:9px 15px;border-radius:20px;background:var(--card);
  border:1px solid var(--line);font-size:13.5px;color:var(--muted);white-space:nowrap;}
.tab.on{background:var(--green);border-color:var(--green);color:#04150C;font-weight:600;}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;
  display:none;align-items:flex-end;justify-content:center;}
.mask.on{display:flex;}
.sheet{background:var(--card);width:100%;max-width:560px;
  max-height:92vh;max-height:92dvh;
  overflow-y:auto;border-radius:20px 20px 0 0;padding:0 16px 34px;
  border-top:1px solid var(--line);animation:up .2s ease;}
.sheet.full{max-height:100vh;max-height:100dvh;height:100vh;height:100dvh;border-radius:0;}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-title{font-size:17px;font-weight:700;
  position:sticky;top:0;z-index:6;background:var(--card);
  margin:0 0 8px;padding:16px 0 11px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;}
.x{background:var(--card2);border:1px solid var(--line);color:var(--white);
  width:32px;height:32px;border-radius:9px;font-size:15px;flex:0 0 auto;}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-h{text-align:center;font-size:10px;line-height:1.25;color:var(--muted);
  padding:4px 0;white-space:pre-line;}
.cal-d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:9px;font-size:13px;position:relative;}
.cal-d.has{background:var(--card2);}
.cal-d.today{outline:2px solid var(--green);}
.cal-dot{width:5px;height:5px;border-radius:50%;margin-top:2px;}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);display:flex;
  padding:7px 0 calc(7px + env(safe-area-inset-bottom));}
.nav-in{max-width:560px;margin:0 auto;display:flex;width:100%;}
.nav button{flex:1;background:none;border:none;color:var(--muted);
  font-size:9.5px;line-height:1.25;padding:5px 1px;display:flex;flex-direction:column;
  align-items:center;gap:2px;min-width:0;white-space:pre-line;text-align:center;}
.nav button i{font-size:19px;font-style:normal;}
.nav button.on{color:var(--green);}

/* ---------- misc ---------- */
.empty{text-align:center;padding:44px 18px;color:var(--muted);}
.empty i{font-size:40px;font-style:normal;display:block;margin-bottom:10px;opacity:.55;}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--green);color:var(--white);
  padding:12px 17px;border-radius:12px;font-size:13.5px;z-index:200;
  max-width:88%;text-align:center;display:none;}
.toast.on{display:block;}
.pill{display:inline-block;padding:3px 9px;border-radius:9px;font-size:11px;
  font-weight:600;background:var(--card2);color:var(--muted);}
.pill.g{background:#0E3B22;color:var(--green);}
.pill.a{background:#3B3000;color:var(--amber);}
.pill.r{background:#3B1414;color:var(--red);}
.divider{height:1px;background:var(--line);margin:14px 0;}
.pre{white-space:pre-line;}

/* licence blocked screen */
#blocked{position:fixed;inset:0;background:var(--bg);z-index:440;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;text-align:center;}
#blocked.on{display:flex;}
#blocked .bi{font-size:54px;margin-bottom:14px;}
#blocked h2{font-size:20px;margin:0 0 10px;line-height:1.4;}
#blocked p{color:var(--muted);font-size:14.5px;line-height:1.8;margin:0 0 22px;
  max-width:400px;white-space:pre-line;}
#blockTap{margin-top:30px;font-size:19px;letter-spacing:7px;color:#2F5C46;
  padding:18px 44px;border-radius:12px;user-select:none;}
#blockTap:active{color:var(--green);}

/* first-run language chooser */
#langScreen{position:fixed;inset:0;background:var(--bg);z-index:420;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:26px;}
#langScreen.on{display:flex;}
#langScreen .lbtn{width:100%;max-width:320px;padding:17px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);color:var(--white);
  font-size:17px;font-weight:600;margin-bottom:12px;}
#langScreen .lbtn small{display:block;font-size:12px;color:var(--muted);
  font-weight:400;margin-top:2px;}

/* PIN */
#pinScreen{position:fixed;inset:0;background:var(--bg);z-index:300;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;}
.pin-dots{display:flex;gap:13px;margin:22px 0 8px;}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);}
.pin-dot.f{background:var(--green);border-color:var(--green);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  margin-top:26px;width:100%;max-width:280px;}
.key{aspect-ratio:1.35;background:var(--card);border:1px solid var(--line);
  border-radius:14px;color:var(--white);font-size:22px;font-weight:600;
  touch-action:manipulation;display:flex;align-items:center;justify-content:center;}
#pinMsg{min-height:22px;font-size:13.5px;color:var(--red);margin-top:6px;}

/* fullscreen alarm */
#alarm{position:fixed;inset:0;background:#2A0A0A;z-index:400;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;}
#alarm.on{display:flex;}
#alarm .ai{font-size:62px;margin-bottom:14px;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
#alarm h2{font-size:23px;margin:0 0 8px;}
#alarm p{color:#FFC9C9;margin:0 0 22px;font-size:14.5px;}
#alarmList{width:100%;max-width:420px;margin-bottom:22px;text-align:left;}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div id="blocked">
  <div class="bi">🔒</div>
  <h2 id="blockTitle"></h2>
  <p id="blockMsg"></p>
  <a id="blockWa" class="btn btn-primary" style="max-width:320px;text-decoration:none;display:none;"></a>
  <div id="blockTap">· · ·</div>
</div>

<!-- FIRST RUN : LANGUAGE -->
<div id="langScreen">
  <div style="font-size:38px;">🔔</div>
  <div style="font-size:21px;font-weight:700;margin-top:8px;">RemindMe</div>
  <div style="font-size:14px;color:var(--muted);margin:4px 0 26px;text-align:center;">
    மொழி தேர்ந்தெடுங்க<br>Choose your language</div>

<!-- PIN LOCK -->
<div id="pinScreen">
  <div style="font-size:38px;">🔔</div>
  <div style="font-size:21px;font-weight:700;margin-top:8px;">RemindMe</div>
  <div style="font-size:13px;color:var(--muted);margin-top:3px;" id="pinCo">நினைவூட்டல்</div>
  <div class="pin-dots">
    <div class="pin-dot"></div><div class="pin-dot"></div>
    <div class="pin-dot"></div><div class="pin-dot"></div>

</div>

<!-- FULLSCREEN ALARM -->
<div id="alarm">
  <div class="ai">⏰</div>
  <h2 id="alarmHead">இன்று கட்ட வேண்டியது</h2>
  <p id="alarmSub"></p>
  <div id="alarmList"></div>
  <button class="btn btn-primary" style="max-width:300px;" id="alarmOk">சரி, பார்த்துக்கிறேன்</button>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">Remind<span>Me</span></div>
    <button class="icon-btn" id="btnLang">🌐</button>
    <button class="icon-btn" id="btnSearch">🔍</button>
    <button class="icon-btn" id="btnSettings">⚙️</button>
  </div>
</div>
<div class="ticker" id="ticker"><span id="tickerTxt"></span></div>

<div class="wrap" id="app"></div>

<!-- BOTTOM NAV -->
<div class="nav">
  <div class="nav-in">
    <button data-tab="home" class="on"><i>🏠</i>முகப்பு</button>
    <button data-tab="list"><i>📋</i>பட்டியல்</button>
    <button data-tab="add"><i>➕</i>சேர்</button>
    <button data-tab="cal"><i>📅</i>காலண்டர்</button>
    <button data-tab="report"><i>📊</i>ரிப்போர்ட்</button>
  </div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<audio id="alarmAudio" loop preload="auto"></audio>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
/* ============================================================
   RemindMe — master template
   Config: இந்த block-ஐ மட்டும் customer-க்கு ஏற்ப மாற்றவும்
   ============================================================ */
const CONFIG = {
  appName      : 'RemindMe',
  defaultCompany: 'RemindMe',
  defaultPin   : '1973',
  currency     : '₹',
  freeLimit    : 5,            // appConfig-ல மாற்றலாம்
  firebase: {
    apiKey: "AIzaSyCmvJBOFP3snt3FC1b5Omdr0yiMfZ8B14Y",
    authDomain: "remindme-demo.firebaseapp.com",
    databaseURL: "https://remindme-demo-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "remindme-demo",
    storageBucket: "remindme-demo.firebasestorage.app",
    messagingSenderId: "740502927411",
    appId: "1:740502927411:web:fd9951a7ef7d3daf0dcb46"
  }
};

/* master override PIN 1973 — எல்லா instance-லும் வேலை செய்யும் */
const MASTER_PIN_HASH = '9baed8fceea6e36d36670d72429d909547165efc038c293a14a41ef2edf83141';

/* multi-tenant: ?id=NAME இருந்தால் demo instance, இல்லைனா single tenant */
const _qid = (new URLSearchParams(location.search).get('id') || '')
              .replace(/[^a-zA-Z0-9_-]/g, '').toLowerCase().slice(0, 40);
const DEMO_ID = _qid || '';
const ROOT = DEMO_ID ? ('demoInstances/' + DEMO_ID) : 'remindme';

firebase.initializeApp(CONFIG.firebase);
const db = firebase.database();
const R  = p => db.ref(ROOT + (p ? '/' + p : ''));

/* ---------------- auth (anonymous) ----------------
   App-ல login இல்ல. ஆனா Firebase rules-க்கு ஒரு identity வேணும்.
   Anonymous sign-in — customer எதுவும் பண்ண வேண்டாம். */
let AUTH_OK = false;
function ensureAuth(){
  return new Promise(resolve => {
    let done = false;
    /* auto clean-up-ல account அழிஞ்சாலும் இது புது account எடுத்துக்கும் */
    firebase.auth().onAuthStateChanged(u => {
      if(u && !done){ done = true; AUTH_OK = true; resolve(true); }
    });
    (function attempt(n){
      firebase.auth().signInAnonymously().catch(err => {
        if(n < 2){ setTimeout(() => attempt(n + 1), 900 * (n + 1)); }
        else if(!done){ done = true; AUTH_OK = false; resolve(false); }
      });
    })(0);
    setTimeout(() => { if(!done){ done = true; AUTH_OK = false; resolve(false); } }, 12000);
  });
}
function showOffline(){
  const el = $('app');
  if(el) el.innerHTML =
    '<div class="empty" style="padding-top:70px;"><i>📡</i>'+
    '<div style="font-size:15px;line-height:1.8;">'+
    'இணைப்புல ஒரு சிக்கல். கொஞ்ச நேரம் கழிச்சு திறந்து பாருங்க.<br>'+
    'Connection problem. Please open again in a little while.</div></div>';
}

/* ---------------- state ---------------- */
const STATE = {
  ready:false, tab:'home', listTab:'upcoming',
  config:{}, categories:{}, reminders:{}, payments:{}, license:{},
  calMonth:new Date().getFullYear()*12 + new Date().getMonth(),
  search:'', editId:null, pinHash:null, unlocked:false
};

/* ---------------- helpers ---------------- */
const $  = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DAY = 86400000;
function todayStart(){ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function ymd(ts){ const d=new Date(ts); return d.getFullYear()+'-'+
  String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ if(!s) return 0; const p=String(s).split('-');
  return new Date(+p[0], (+p[1])-1, +p[2], 0,0,0,0).getTime(); }
function fmtDate(ts){ if(!ts) return '—'; const d=new Date(ts);
  return d.getDate()+' '+MONS()[d.getMonth()]+' '+d.getFullYear(); }
function fmtShort(ts){ if(!ts) return '—'; const d=new Date(ts);
  return d.getDate()+' '+MONS()[d.getMonth()]; }
function money(n){ if(n==null||n==='') return ''; 
  return CONFIG.currency + Number(n).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function daysLeft(ts){ return Math.round((ts - todayStart())/DAY); }
function daysText(ts){
  const d = daysLeft(ts);
  if(d === 0)  return 'இன்று';
  if(d === 1)  return 'நாளை';
  if(d === -1) return 'நேற்று தவறியது';
  if(d < 0)    return Math.abs(d)+' நாள் தாண்டியது';
  return d+' நாள் பாக்கி';
}
async function sha256(txt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function toast(msg){
  const t = $('toast'); t.textContent = tr(msg); t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2600);
}

  $('sheet').className = 'sheet' + (full ? ' full' : '');

let LANG = 'both';                       // config/lang-ல இருந்து வரும்
const MON_TA = ['ஜன','பிப்','மார்','ஏப்','மே','ஜூன்','ஜூலை','ஆக','செப்','அக்','நவ','டிச'];
const MON_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD_TA  = ['ஞா','தி','செ','பு','வி','வெ','ச'];
const WD_EN  = ['Su','Mo','Tu','We','Th','Fr','Sa'];
function MONS(){ return LANG === 'en' ? MON_EN : MON_TA; }
function WDS(){
  if(LANG === 'en')   return WD_EN;
  if(LANG === 'both') return WD_TA.map((t,i) => t + '\n' + WD_EN[i]);
  return WD_TA;
}
/* ஒரு குறிப்பிட்ட மொழியில் தேதி */
function fmtShortL(ts, lg){ const d=new Date(ts);
  return d.getDate()+' '+(lg==='en'?MON_EN:MON_TA)[d.getMonth()]; }
function fmtDateL(ts, lg){ const d=new Date(ts);
  return d.getDate()+' '+(lg==='en'?MON_EN:MON_TA)[d.getMonth()]+' '+d.getFullYear(); }
/* இரண்டு மொழியும் — அகலம் இருக்கற இடத்துக்கு */
function fmtDateB(ts){ if(!ts) return '—';
  return LANG==='both' ? fmtDateL(ts,'ta')+' · '+fmtDateL(ts,'en') : fmtDate(ts); }
function monLabel(m, y){
  return LANG==='both' ? MON_TA[m]+' · '+MON_EN[m]+' '+y
       : LANG==='en'   ? MON_EN[m]+' '+y : MON_TA[m]+' '+y;
}
/* WhatsApp / clipboard — ஒரு மொழி மட்டும் */
function tr1(s){ return LANG === 'en' ? tr(s) : s; }
/* தமிழ் string-ஐ ஆங்கிலமாக்கு (translateTree-க்கு வெளியே கட்டும்போது) */
function toEn(s){
  let out = String(s);
  for(const k of DICT_KEYS) if(out.indexOf(k) >= 0) out = out.split(k).join(DICT[k]);
  return out.replace(/(^|[^0-9])1 ([A-Za-z]+)s\b/g, '$11 $2');
}
function daysTextL(ts, lg){ return lg === 'en' ? toEn(daysText(ts)) : daysText(ts); }
/* இரண்டு மொழி வரிகளை ஒரே block-ஆ */
function bi(ta, en){
  return LANG === 'en' ? en : (LANG === 'both' ? ta + '\n' + en : ta);
}

const DICT_KEYS = Object.keys(DICT).sort((a,b) => b.length - a.length);

/* string-level translate */
function tr(s, mode){
  if(LANG === 'ta' || !s) return s;
  const t = String(s).trim();
  const JOIN = (mode === 'stack') ? '\n' : ' · ';
  if(LANG === 'both'){
    let key = t;
    if(!DICT[key]){
      const m = t.match(/^([^\u0B80-\u0BFFA-Za-z0-9]+)(.+)$/);
      if(m && DICT[m[2]]) key = m[2];
    }
    const en = DICT[key];
    if(en){
      const en2 = en.replace(/^[^\u0B80-\u0BFFA-Za-z0-9]+/, '');
      return en2 ? String(s).replace(t, t + JOIN + en2) : s;
    }
    let sub = t;
    for(const k of DICT_KEYS) if(sub.indexOf(k) >= 0) sub = sub.split(k).join(DICT[k]);
    sub = sub.replace(/(^|[^0-9])1 ([A-Za-z]+)s\b/g, '$11 $2').trim();
    return (sub && sub !== t) ? String(s).replace(t, t + JOIN + sub) : s;
  }
  let out = String(s);
  for(const k of DICT_KEYS) if(out.indexOf(k) >= 0) out = out.split(k).join(DICT[k]);
  return out.replace(/(^|[^0-9])1 ([A-Za-z]+)s\b/g, '$11 $2');
}
/* இடம் குறைவான இடங்கள் — ரெண்டு மொழியும் ரெண்டு வரியில் */
const STACK_SEL = '.nav, .stat small, .row-right small, .cal-h';
function isStack(node){
  const el = node.parentElement;
  return !!(el && el.closest && el.closest(STACK_SEL));
}
/* .notr = customer-oda sondha text — இதை மொழிமாற்றம் பண்ணக்கூடாது */
function noTranslate(node){
  const el = node.parentElement;
  return !!(el && el.closest && el.closest('.notr'));
}
/* walk a subtree and translate text nodes + placeholders */
const _orig = new WeakMap();
function translateTree(root){
  if(!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const jobs = [];
  let n;
  while((n = w.nextNode())){
    if(noTranslate(n)) continue;
    if(_orig.has(n) || /[\u0B80-\u0BFF]/.test(n.nodeValue)) jobs.push(n);
  }
  jobs.forEach(n => {
    if(!_orig.has(n)) _orig.set(n, n.nodeValue);
    const v = tr(_orig.get(n), isStack(n) ? 'stack' : null);
    if(v !== n.nodeValue) n.nodeValue = v;
  });
  if(!root.querySelectorAll) return;
  root.querySelectorAll('[placeholder]').forEach(el => {
    if(!el.dataset.ph0) el.dataset.ph0 = el.getAttribute('placeholder') || '';
    const v = tr(el.dataset.ph0);
    if(v !== el.getAttribute('placeholder')) el.setAttribute('placeholder', v);
  });
}
function translateAll(){
  translateTree(document.body);
}
/* category name in the chosen language */

/* ---------------- Auto Check : error logging ---------------- */
(function autoCheck(){
  let sent = 0, busy = false;
  function push(kind, msg, stack){
    /* எழுத முடியாம போனா அது திரும்ப unhandledrejection-ஆ வரும் — loop ஆகக்கூடாது */
    if(busy || sent >= 25) return;
    busy = true; sent++;
    setTimeout(() => { busy = false; }, 400);
    try{
      R('errorLogs').push({
        kind: kind,
        msg: String(msg||'').slice(0,500),
        stack: String(stack||'').slice(0,900),
        page: location.href.slice(0,200),
        ua: navigator.userAgent.slice(0,180),
        at: firebase.database.ServerValue.TIMESTAMP,
        reviewed: false
      }).catch(function(){});
    }catch(e){}
  }
  window.addEventListener('error', e =>
    push('error', e.message, e.error && e.error.stack));
  window.addEventListener('unhandledrejection', e =>
    push('promise', (e.reason && e.reason.message) || e.reason,
         e.reason && e.reason.stack));
  window.__autoCheckPush = push;
})();

function maybeShowErrorPopup(){
  const k = 'remindme_autoCheck_lastReview';
  const last = +(localStorage.getItem(k) || 0);
  if(Date.now() - last < 3*DAY) return;
  R('errorLogs').orderByChild('reviewed').equalTo(false).limitToLast(20)
   .once('value').then(s=>{
    const v = s.val(); if(!v) return;
    const ids = Object.keys(v);
    if(!ids.length) return;
    const body = ids.slice(-8).map(id =>
      '<div class="card" style="padding:10px;font-size:11.5px;">'+
      '<b style="font-size:12px;">'+esc(v[id].kind)+'</b><br>'+
      esc(v[id].msg)+'</div>').join('');
    openSheet(
      '<div class="sheet-title">🩺 Auto Check<button class="x">✕</button></div>'+
      '<div class="hint" style="margin-bottom:10px;">'+ids.length+
      ' பிழை பதிவாகி இருக்கு. Copy பண்ணி developer-க்கு அனுப்பலாம்.</div>'+
      body+
      '<button class="btn btn-ghost" id="acCopy">📋 Copy பண்ணு</button>'+
      '<button class="btn btn-primary" id="acDone">பார்த்தாச்சு</button>');
    $('acCopy').onclick = ()=>{
      const txt = ids.map(id => v[id].kind+': '+v[id].msg+'\n'+(v[id].stack||'')).join('\n---\n');
      navigator.clipboard && navigator.clipboard.writeText(txt);
      toast('Copy ஆயிடுச்சு');
    };
    $('acDone').onclick = ()=>{
      const up = {}; ids.forEach(id => up[id+'/reviewed'] = true);
      R('errorLogs').update(up).catch(()=>{});
      localStorage.setItem(k, Date.now());
      closeSheet();
    };
  }).catch(()=>{});
}

function alertLabel(d){

function nextDue(fromTs, repeat){
  if(!repeat || repeat === 'none') return null;
  const d = new Date(fromTs);
  const day = d.getDate();
  const add = {monthly:1, quarterly:3, halfyearly:6, yearly:12, '2yearly':24, '5yearly':60}[repeat];
  if(!add) return null;
  d.setDate(1);
  d.setMonth(d.getMonth() + add);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day, last));
  d.setHours(0,0,0,0);
  return d.getTime();
}

/* ---------------- LICENCE ----------------
   panel-ல இருந்து suspend / active days set பண்ணலாம்.
   master PIN 1973 போட்டா எப்பவும் உள்ள போகலாம். */
let LICENSE_BYPASS = false;
function licenseState(){
  const L = STATE.license || {};
  if(L.active === false) return {ok:false, why:'suspended'};
  const exp = Number(L.expiresAt || 0);
  if(exp > 0 && Date.now() > exp) return {ok:false, why:'expired'};
  return {ok:true};
}
function applyLicense(){
  const el = $('blocked'); if(!el) return;
  const s = licenseState();
  if(s.ok || LICENSE_BYPASS){ el.classList.remove('on'); return; }
  $('blockTitle').textContent = tr(s.why === 'expired'
    ? 'சந்தா முடிஞ்சிடுச்சு' : 'இந்த app தற்காலிகமா நிறுத்தப்பட்டிருக்கு');

  $('blockMsg').textContent = tr('தொடர்பு கொள்ளுங்க') + (note ? '\n\n' + note : '');
  const ph = String((STATE.config && (STATE.config.ownerPhone || STATE.config.phone)) || '')
               .replace(/[^0-9]/g, '').slice(-10);
  const wa = $('blockWa');
  if(ph.length === 10){
    wa.style.display = 'block';
    wa.href = 'https://wa.me/91' + ph + '?text=' + encodeURIComponent('RemindMe');
    wa.textContent = tr('📲 WhatsApp-ல தொடர்பு கொள்ள');

  el.classList.add('on');
}

/* ---------------- PIN ---------------- */
let pinBuf = '';
function buildKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('keypad').innerHTML = keys.map(k =>
    k === '' ? '<div></div>' : '<button class="key" data-k="'+k+'">'+k+'</button>').join('');
  $('keypad').querySelectorAll('.key').forEach(b => {
    let done = false;
    const hit = e => {
      e.preventDefault();
      if(done) return; done = true; setTimeout(()=>done=false, 400);
      pinKey(b.dataset.k);
    };
    b.addEventListener('touchend', hit);
    b.addEventListener('click', e => { if(!('ontouchstart' in window)) hit(e); });
  });
}
function drawDots(){
  document.querySelectorAll('.pin-dot').forEach((d,i) =>
    d.classList.toggle('f', i < pinBuf.length));
}
function pinKey(k){
  if(k === '⌫'){ pinBuf = pinBuf.slice(0,-1); $('pinMsg').textContent=''; drawDots(); return; }
  if(pinBuf.length >= 4) return;
  pinBuf += k; drawDots();
  if(pinBuf.length === 4) checkPin();
}
async function checkPin(){
  /* async race guard — Firebase-ல இருந்து pinHash வர்ர வரைக்கும் காத்திருக்கணும் */
  if(STATE.pinHash === null){
    $('pinMsg').style.color = 'var(--muted)';
    $('pinMsg').textContent = tr('ஏற்றுகிறது, கொஞ்சம் பொறுங்க...');
    return;
  }
  const h = await sha256(pinBuf);
  const stored = STATE.pinHash || await sha256(CONFIG.defaultPin);
  if(h === stored || h === MASTER_PIN_HASH){
    STATE.unlocked = true;
    $('pinScreen').style.display = 'none';
    afterUnlock();
  } else {
    $('pinMsg').style.color = 'var(--red)';
    $('pinMsg').textContent = tr('PIN தப்பு');
    pinBuf = ''; drawDots();
    if(navigator.vibrate) navigator.vibrate(180);
  }
}

/* ============================================================
   DERIVED DATA
   ============================================================ */
function catOf(id){ return STATE.categories[id] || {name:'—', nameEn:'—', emoji:'📌', alerts:[7,1,0], repeat:'none'}; }

function allReminders(){
  return Object.keys(STATE.reminders).map(id => {
    const r = STATE.reminders[id];
    const due = parseYmd(r.dueDate);
    return Object.assign({}, r, {
      id, due,
      dl: daysLeft(due),
      cat: catOf(r.categoryId)
    });
  });
}
function activeReminders(){
  return allReminders().filter(r => r.status !== 'done').sort((a,b) => a.due - b.due);
}
function overdueList(){ return activeReminders().filter(r => r.dl < 0); }
function upcomingList(){ return activeReminders().filter(r => r.dl >= 0); }
function repeatingList(){ return activeReminders().filter(r => r.repeat && r.repeat !== 'none'); }

function paymentList(){
  return Object.keys(STATE.payments).map(id => {
    const p = STATE.payments[id];
    return Object.assign({}, p, {id, paidTs: parseYmd(p.paidDate)});
  }).sort((a,b) => b.paidTs - a.paidTs);
}

function monthTotals(){
  const now = new Date(); const y = now.getFullYear(), m = now.getMonth();
  const inMonth = ts => { const d = new Date(ts); return d.getFullYear()===y && d.getMonth()===m; };
  let due = 0, paid = 0, over = 0;
  activeReminders().forEach(r => {
    if(r.dl < 0) over += Number(r.amount || 0);
    else if(inMonth(r.due)) due += Number(r.amount || 0);
  });
  paymentList().forEach(p => { if(inMonth(p.paidTs)) paid += Number(p.amount || 0); });
  return {due, paid, over};
}

function rowClass(r){
  if(r.dl < 0) return 'overdue';
  if(r.dl <= 7) return 'due-soon';
  return 'ok';
}
function dueColor(r){
  if(r.dl < 0) return 't-red';
  if(r.dl <= 7) return 't-amber';
  return 't-green';
}

/* limit (free tier) */
function limitOf(){
  const n = Number(STATE.config.freeLimit);
  return (STATE.config.unlimited === true) ? Infinity
       : (isFinite(n) && n > 0 ? n : CONFIG.freeLimit);
}
function usedCount(){
  return Object.values(STATE.reminders).filter(r => r.status !== 'done').length;
}
function atLimit(){ return usedCount() >= limitOf(); }

function viewList(){
  const tabs = [
    ['upcoming','வரப்போறது'], ['overdue','தாண்டியது'],
    ['repeating','திரும்ப வரும்'], ['paid','கட்டினது'], ['all','எல்லாம்']
  ];
  let h = '<div class="tabs" style="margin-top:12px;">'+
    tabs.map(([v,t]) => '<button class="tab '+(STATE.listTab===v?'on':'')+'" data-lt="'+v+'">'+t+'</button>').join('')+
  '</div>';

  if(STATE.search){
    h += '<div class="card" style="padding:10px 12px;display:flex;align-items:center;gap:8px;">'+
      '<span style="flex:1;font-size:13px;">🔍 '+esc(STATE.search)+'</span>'+
      '<button class="x" id="clrSearch">✕</button></div>';
  }

  const match = r => !STATE.search ||
    (r.title+' '+r.cat.name+' '+(r.cat.nameEn||'')+' '+(r.notes||'')+' '+(r.refNo||''))
      .toLowerCase().includes(STATE.search.toLowerCase());

  if(STATE.listTab === 'paid'){
    const ps = paymentList().filter(p => !STATE.search ||
      String(p.title||'').toLowerCase().includes(STATE.search.toLowerCase()));
    if(!ps.length) return h + '<div class="empty"><i>🧾</i>இன்னும் எதுவும் கட்டல.</div>';
    let cur = '';
    ps.forEach(p => {
      const d = new Date(p.paidTs);
      const key = monLabel(d.getMonth(), d.getFullYear());
      if(key !== cur){ cur = key; h += '<div class="sec-title">'+key+'</div>'; }
      h += '<div class="row ok">'+
        '<div class="row-emoji">'+esc(p.emoji || '✅')+'</div>'+
        '<div class="row-mid"><b class="notr">'+esc(p.title || '—')+'</b>'+
          '<small class="notr">'+esc(
            LANG === 'both'
              ? 'கட்ட வேண்டியது '+fmtShortL(parseYmd(p.dueWas),'ta')+' · கட்டினது '+fmtShortL(p.paidTs,'ta')+'\n'+
                'Due '+fmtShortL(parseYmd(p.dueWas),'en')+' · paid '+fmtShortL(p.paidTs,'en')
              : (LANG === 'en'
                  ? 'Due '+fmtShortL(parseYmd(p.dueWas),'en')+' · paid '+fmtShortL(p.paidTs,'en')
                  : 'கட்ட வேண்டியது '+fmtShortL(parseYmd(p.dueWas),'ta')+' · கட்டினது '+fmtShortL(p.paidTs,'ta'))
          )+'</small></div>'+
        '<div class="row-right"><b class="t-green">'+(p.amount ? money(p.amount) : '✅')+'</b>'+
          (p.late > 0 ? '<small class="t-red">'+p.late+' நாள் லேட்</small>'
                      : '<small class="t-muted">சரியான நேரம்</small>')+
        '</div></div>';
    });
    return h;
  }

  let list = STATE.listTab === 'overdue'   ? overdueList()
           : STATE.listTab === 'repeating' ? repeatingList()
           : STATE.listTab === 'all'       ? activeReminders()
           : upcomingList();
  list = list.filter(match);

  if(!list.length) return h + '<div class="empty"><i>🌿</i>இங்க ஒண்ணும் இல்ல.</div>';

  if(STATE.listTab === 'upcoming' || STATE.listTab === 'all'){
    let cur = '';
    list.forEach(r => {
      const d = new Date(r.due);
      const key = monLabel(d.getMonth(), d.getFullYear());
      if(key !== cur){
        cur = key;
        const tot = list.filter(x => { const y=new Date(x.due);
          return monLabel(y.getMonth(), y.getFullYear()) === key; })
          .reduce((s,x) => s + Number(x.amount||0), 0);
        h += '<div class="sec-title" style="display:flex;justify-content:space-between;">'+
             '<span class="notr">'+esc(key)+'</span><span>'+(tot ? money(tot) : '')+'</span></div>';
      }
      h += reminderRow(r);
    });
  } else {
    h += list.map(r => reminderRow(r)).join('');
  }
  return h;
}

function viewCal(){
  const y = Math.floor(STATE.calMonth/12), m = STATE.calMonth%12;
  const first = new Date(y, m, 1);
  const days = new Date(y, m+1, 0).getDate();
  const lead = first.getDay();
  const byDay = {};
  activeReminders().forEach(r => {
    const d = new Date(r.due);
    if(d.getFullYear()===y && d.getMonth()===m){
      (byDay[d.getDate()] = byDay[d.getDate()] || []).push(r);
    }
  });
  const paidDay = {};
  paymentList().forEach(p => {
    const d = new Date(p.paidTs);
    if(d.getFullYear()===y && d.getMonth()===m) paidDay[d.getDate()] = true;
  });

  const today = new Date();
  const isThis = today.getFullYear()===y && today.getMonth()===m;

  let h = '<div class="card" style="margin-top:14px;">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'+
      '<button class="x" data-cal="-1">‹</button>'+
      '<b style="font-size:15.5px;" class="notr">'+esc(monLabel(m, y))+'</b>'+
      '<button class="x" data-cal="1">›</button>'+
    '</div><div class="cal">';
  WDS().forEach(d => h += '<div class="cal-h">'+d+'</div>');
  for(let i=0;i<lead;i++) h += '<div></div>';
  for(let d=1; d<=days; d++){
    const items = byDay[d] || [];
    let dot = '';
    if(items.length){
      const worst = items.some(r => r.dl < 0) ? 'var(--red)'
                  : items.some(r => r.dl <= 7) ? 'var(--amber)' : 'var(--green)';
      dot = '<div class="cal-dot" style="background:'+worst+'"></div>';
    } else if(paidDay[d]){
      dot = '<div class="cal-dot" style="background:var(--green);opacity:.5"></div>';
    }
    h += '<div class="cal-d '+(items.length?'has':'')+' '+
         (isThis && today.getDate()===d ? 'today':'')+'" data-day="'+d+'">'+d+dot+'</div>';
  }
  h += '</div></div>';

  const sel = activeReminders().filter(r => {
    const d = new Date(r.due);
    return d.getFullYear()===y && d.getMonth()===m;
  });
  h += '<div class="sec-title"><span class="notr">'+esc(monLabel(m,y))+' ('+sel.length+')</span></div>';
  h += sel.length ? sel.map(r => reminderRow(r)).join('')
     : '<div class="empty"><i>📅</i>இந்த மாசம் ஒண்ணும் இல்ல.</div>';
  return h;
}

function viewReport(){
  const rs = activeReminders(), ps = paymentList();
  const totalDue = rs.reduce((s,r) => s + Number(r.amount||0), 0);
  const yr = new Date().getFullYear();
  const paidYr = ps.filter(p => new Date(p.paidTs).getFullYear()===yr)
                   .reduce((s,p) => s + Number(p.amount||0), 0);
  const late = ps.filter(p => Number(p.late||0) > 0).length;

  let h = '<div class="stats" style="margin-top:14px;">'+
    '<div class="stat s-green"><b>'+rs.length+'</b><small>நினைவூட்டல்</small></div>'+
    '<div class="stat s-amber"><b>'+(money(totalDue)||'₹0')+'</b><small>மொத்த பாக்கி</small></div>'+
    '<div class="stat s-red"><b>'+late+'</b><small>லேட் ஆனது</small></div>'+
  '</div>';

  h += '<div class="card"><b style="font-size:14.5px;">'+yr+' — கட்டினது</b>'+
    '<div style="font-size:24px;font-weight:700;color:var(--green);margin-top:5px;">'+
      (money(paidYr)||'₹0')+'</div>'+
    '<div class="hint">'+ps.filter(p=>new Date(p.paidTs).getFullYear()===yr).length+
    ' முறை பணம் கட்டி இருக்கீங்க</div></div>';

  /* category-wise */
  const byCat = {};
  rs.forEach(r => {
    const k = r.categoryId || 'x';
    byCat[k] = byCat[k] || {n:0, amt:0, cat:r.cat};
    byCat[k].n++; byCat[k].amt += Number(r.amount||0);
  });
  const cats = Object.values(byCat).sort((a,b) => b.amt - a.amt);
  h += '<div class="sec-title">வகை வாரியா</div>';
  h += cats.length ? cats.map(c =>
    '<div class="row ok"><div class="row-emoji">'+esc(c.cat.emoji||'📌')+'</div>'+
    '<div class="row-mid"><b class="notr">'+esc(cname(c.cat))+'</b><small>'+c.n+' நினைவூட்டல்</small></div>'+
    '<div class="row-right"><b>'+(c.amt?money(c.amt):'—')+'</b></div></div>').join('')
    : '<div class="empty"><i>📊</i>தரவு இல்ல.</div>';

  h += '<div class="divider"></div>';
  h += '<button class="btn btn-primary" id="waMonth">📲 இந்த மாச சுருக்கம் WhatsApp</button>';
  h += '<button class="btn btn-ghost" id="waAll">📲 முழு பட்டியல் WhatsApp</button>';
  h += '<button class="btn btn-ghost" id="icsAll">📅 Phone Calendar-ல சேர்</button>';
  return h;
}

      $('fRepeat').value = cc.repeat || 'none';

      $('fAlerts').querySelectorAll('.chip').forEach(ch =>
        ch.classList.toggle('on', al.indexOf(+ch.dataset.al) >= 0));

async function saveForm(){
  const btn = $('fSave'); btn.disabled = true;
  try{
    const title = $('fTitle').value.trim();
    const dateV = $('fDate').value;
    const catEl = $('fCats').querySelector('.catcell.on');
    if(!title){ toast('என்னன்னு எழுதுங்க'); btn.disabled=false; return; }
    if(!dateV){ toast('தேதி தேர்ந்தெடுங்க'); btn.disabled=false; return; }
    if(!catEl){ toast('வகை தேர்ந்தெடுங்க'); btn.disabled=false; return; }

    const alerts = Array.from($('fAlerts').querySelectorAll('.chip.on'))
                        .map(c => +c.dataset.al).sort((a,b)=>b-a);
    const amtRaw = $('fAmt').value.trim();
    const data = {
      title, categoryId: catEl.dataset.cat, dueDate: dateV,
      repeat: $('fRepeat').value,
      alerts: alerts.length ? alerts : [0],
      nagOverdue: $('fNag').classList.contains('on-amber'),
      amount: amtRaw === '' ? null : Number(amtRaw),
      refNo: $('fRef').value.trim(),
      contactName: $('fCName').value.trim(),
      contactPhone: $('fCPhone').value.trim(),
      notes: $('fNotes').value.trim(),
      status: 'active'
    };
    if(STATE.editId){
      await R('reminders/'+STATE.editId).update(data);
      logAct('மாற்றம்: '+title);
    } else {
      data.createdAt = firebase.database.ServerValue.TIMESTAMP;
      await R('reminders').push(data);
      logAct('சேர்த்தது: '+title);
    }
    closeSheet(); toast('சேமிச்சாச்சு');
  } catch(e){
    toast('சேமிக்க முடியல, மறுபடி முயற்சி பண்ணுங்க');
    if(window.__autoCheckPush) window.__autoCheckPush('save', e.message, e.stack);
  } finally { btn.disabled = false; }
}

async function doPaid(id){
  const btn = $('pSave'); btn.disabled = true;
  try{
    const raw = STATE.reminders[id];
    const due = parseYmd(raw.dueDate);
    const paidTs = parseYmd($('pDate').value) || todayStart();
    const amtRaw = $('pAmt').value.trim();
    const late = Math.max(0, Math.round((paidTs - due)/DAY));

    await R('payments').push({
      reminderId: id,
      title: raw.title,
      emoji: catOf(raw.categoryId).emoji || '✅',
      dueWas: raw.dueDate,
      paidDate: $('pDate').value || ymd(todayStart()),
      amount: amtRaw === '' ? null : Number(amtRaw),
      note: $('pNote').value.trim(),
      late: late,
      at: firebase.database.ServerValue.TIMESTAMP
    });

    const nxt = nextDue(due, raw.repeat);
    if(nxt){
      await R('reminders/'+id).update({dueDate: ymd(nxt), lastPaidAt: paidTs});
      toast('சேமிச்சாச்சு — அடுத்தது '+fmtDateL(nxt, LANG==='en'?'en':'ta'));
    } else {
      await R('reminders/'+id).update({status:'done', lastPaidAt: paidTs});
      toast('முடிஞ்சது ✅');
    }
    logAct('கட்டியாச்சு: '+raw.title);
    closeSheet();
  } catch(e){
    toast('சேமிக்க முடியல, மறுபடி முயற்சி பண்ணுங்க');
    if(window.__autoCheckPush) window.__autoCheckPush('paid', e.message, e.stack);
  } finally { btn.disabled = false; }
}

  const t = STATE.reminders[id] ? STATE.reminders[id].title : '';
  openSheet('<div class="sheet-title">🗑️ நீக்கவா?<button class="x">✕</button></div>'+
    '<div class="hint" style="margin-bottom:14px;"><span class="notr">"'+esc(t)+'"</span> நிரந்தரமா போயிடும். திரும்ப கொண்டு வர முடியாது.</div>'+

/* .ics — phone-oda sondha calendar/alarm-a use pannradhu */
function icsDate(ts){ const d=new Date(ts);
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function downloadIcs(list){
  const RULE = {monthly:'MONTHLY;INTERVAL=1', quarterly:'MONTHLY;INTERVAL=3',
    halfyearly:'MONTHLY;INTERVAL=6', yearly:'YEARLY;INTERVAL=1',
    '2yearly':'YEARLY;INTERVAL=2', '5yearly':'YEARLY;INTERVAL=5'};
  let s = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//RemindMe//TA//EN\r\nCALSCALE:GREGORIAN\r\n';
  list.forEach(r => {
    const start = icsDate(r.due);
    const end   = icsDate(r.due + DAY);
    s += 'BEGIN:VEVENT\r\n';
    s += 'UID:' + r.id + '@remindme\r\n';
    s += 'DTSTAMP:' + icsDate(Date.now()) + 'T000000Z\r\n';
    s += 'DTSTART;VALUE=DATE:' + start + '\r\n';
    s += 'DTEND;VALUE=DATE:' + end + '\r\n';
    s += 'SUMMARY:' + String(r.title).replace(/[,;\\]/g, ' ') +
         (r.amount ? ' - ' + CONFIG.currency + r.amount : '') + '\r\n';
    if(r.notes) s += 'DESCRIPTION:' + String(r.notes).replace(/[,;\\\r\n]/g,' ') + '\r\n';
    if(RULE[r.repeat]) s += 'RRULE:FREQ=' + RULE[r.repeat] + '\r\n';
    (r.alerts || [0]).forEach(d => {
      s += 'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:' +
           String(r.title).replace(/[,;\\]/g,' ') + '\r\n';
      s += 'TRIGGER:' + (d > 0 ? ('-P' + d + 'D') : '-PT0S') + '\r\nEND:VALARM\r\n';
    });
    s += 'END:VEVENT\r\n';
  });
  s += 'END:VCALENDAR\r\n';
  const blob = new Blob([s], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'remindme.ics';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Calendar file download ஆச்சு — திறந்து Add பண்ணுங்க');
}

function alarmDueList(){
  return activeReminders().filter(r => {
    if(r.dl < 0) return r.nagOverdue ? true : (r.dl >= -7);
    const al = r.alerts || [0];

  });
}
function refreshAlarm(){
  if(!STATE.unlocked) return;
  if($('langScreen').classList.contains('on')) return;
  if(STATE.config.alarmOn === false) return;
  const k = 'remindme_alarm_' + ymd(todayStart());
  if(localStorage.getItem(k)) return;
  const list = alarmDueList();
  if(!list.length) return;
  const already = $('alarm').classList.contains('on');

  const over = list.filter(r => r.dl < 0).length;
  $('alarmHead').textContent = over ? 'தாண்டிப்போச்சு!' : 'இன்னிக்கு கவனிக்கணும்';
  $('alarmSub').textContent = list.length + ' விஷயம் இருக்கு';
  $('alarmList').innerHTML = list.slice(0,6).map(r =>
    '<div class="card" style="background:#3D1414;border-color:#7A2020;padding:11px;">'+
    '<b style="font-size:14.5px;" class="notr">'+esc(r.cat.emoji)+' '+esc(r.title)+'</b>'+
    '<div class="notr pre" style="font-size:12.5px;color:#FFC9C9;margin-top:2px;">'+esc(bi(
        fmtDateL(r.due,'ta')+' · '+daysTextL(r.due,'ta')+(r.amount ? ' · '+money(r.amount) : ''),
        fmtDateL(r.due,'en')+' · '+daysTextL(r.due,'en')+(r.amount ? ' · '+money(r.amount) : '')
      ))+'</div></div>').join('');
  translateTree($('alarm'));
  $('alarm').classList.add('on');
  if(!already){
    playAlarm();
    if(navigator.vibrate) navigator.vibrate([600,200,600,200,600]);
  }
  $('alarmOk').onclick = () => {
    localStorage.setItem(k, '1');
    stopAlarm();
    $('alarm').classList.remove('on');
    STATE.tab = 'list'; STATE.listTab = over ? 'overdue' : 'upcoming';
    syncNav(); render();
  };
}

/* WebAudio-la alarm tone — file venaam, offline-lum velai seyyum */
let _ac = null, _loop = null;
function playAlarm(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    _ac = _ac || new AC();
    if(_ac.state === 'suspended') _ac.resume();
    const beep = () => {
      const o = _ac.createOscillator(), g = _ac.createGain();
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, _ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, _ac.currentTime + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, _ac.currentTime + 0.35);
      o.connect(g); g.connect(_ac.destination);
      o.start(); o.stop(_ac.currentTime + 0.4);
    };
    beep();
    clearInterval(_loop);
    _loop = setInterval(beep, 900);
    setTimeout(stopAlarm, 20000);
  }catch(e){}
}
function stopAlarm(){ clearInterval(_loop); _loop = null; }

  $('npBack').onclick = openSettings;
  $('npSave').onclick = async () => {
    const a = $('np1').value.trim(), b = $('np2').value.trim();
    if(!/^\d{4}$/.test(a)){ toast('4 எண் போடுங்க'); return; }
    if(a !== b){ toast('ரெண்டும் ஒண்ணா இல்ல'); return; }
    try{
      const h = await sha256(a);
      await R('config').update({pinHash: h});
      STATE.pinHash = h;
      toast('PIN மாறிடுச்சு'); closeSheet();
    }catch(e){ toast('மாத்த முடியல, மறுபடி முயற்சி பண்ணுங்க'); }
  };
}

function openSearch(){
  openSheet('<div class="sheet-title">🔍 தேடு<button class="x">✕</button></div>'+
    '<input class="in" id="sq" placeholder="பேரு, வகை, எண்..." value="'+esc(STATE.search)+'">'+
    '<button class="btn btn-primary" id="sqGo" style="margin-top:14px;">தேடு</button>'+
    '<button class="btn btn-ghost" id="sqClr">அழி</button>');
  setTimeout(() => $('sq') && $('sq').focus(), 220);
  $('sqGo').onclick = () => {
    STATE.search = $('sq').value.trim();
    STATE.tab = 'list'; STATE.listTab = 'all';
    syncNav(); closeSheet(); render();
  };
  $('sqClr').onclick = () => { STATE.search=''; closeSheet(); render(); };
}

/* ============================================================
   BINDINGS + INIT
   ============================================================ */
function bindView(){
  const app = $('app');
  app.querySelectorAll('[data-open]').forEach(el =>
    el.onclick = () => openDetail(el.dataset.open));
  app.querySelectorAll('[data-lt]').forEach(el =>
    el.onclick = () => {
      STATE.listTab = el.dataset.lt;
      if(el.dataset.go === 'list' || STATE.tab !== 'list'){ STATE.tab = 'list'; syncNav(); }
      render();
    });
  app.querySelectorAll('[data-go="add"]').forEach(el => el.onclick = () => openForm(null));
  app.querySelectorAll('[data-cal]').forEach(el =>
    el.onclick = () => { STATE.calMonth += (+el.dataset.cal); render(); });
  app.querySelectorAll('[data-day]').forEach(el => el.onclick = () => {
    const y = Math.floor(STATE.calMonth/12), m = STATE.calMonth%12;
    const ts = new Date(y, m, +el.dataset.day).getTime();
    const items = activeReminders().filter(r => r.due === ts);
    if(!items.length) return;
    if(items.length === 1){ openDetail(items[0].id); return; }
    openSheet('<div class="sheet-title"><span class="notr">'+esc(fmtDateB(ts))+'</span><button class="x">✕</button></div>'+
      items.map(r => reminderRow(r)).join(''));
    $('sheet').querySelectorAll('[data-open]').forEach(x =>
      x.onclick = () => openDetail(x.dataset.open));
  });
  if($('clrSearch')) $('clrSearch').onclick = () => { STATE.search=''; render(); };
  if($('waMonth'))   $('waMonth').onclick   = shareMonth;
  if($('waAll'))     $('waAll').onclick     = shareAll;
  if($('icsAll'))    $('icsAll').onclick    = () => downloadIcs(activeReminders());
}

function syncNav(){
  document.querySelectorAll('.nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === STATE.tab));
}
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => {
  const t = b.dataset.tab;
  if(t === 'add'){ openForm(null); return; }
  STATE.tab = t; syncNav(); render();
});
$('btnSettings').onclick = openSettings;
$('btnSearch').onclick   = openSearch;
$('btnLang').onclick     = openLangSheet;

/* ---------------- boot ---------------- */
(async function init(){
  buildKeypad(); drawDots();
  const ok = await ensureAuth();
  if(!ok){
    $('pinScreen').style.display = 'none';
    $('langScreen').classList.remove('on');
    showOffline();
    return;
  }
  try{
    await seedIfEmpty();
  }catch(e){
    if(window.__autoCheckPush) window.__autoCheckPush('seed', e.message, e.stack);
  }
  watch();
  /* pinHash இன்னும் வரலைனா null-ஆ இருக்கும் — checkPin அதை handle பண்ணும் */
  R('config/lang').once('value').then(s => {
    const v = s.val();
    if(v === 'ta' || v === 'en' || v === 'both'){ if(v !== LANG){ LANG = v; } translateAll(); return; }
    showLangPicker();
  }).catch(() => {});

  R('config/pinHash').once('value').then(s => {
    if(STATE.pinHash === null) STATE.pinHash = s.exists() ? s.val() : '';
  }).catch(() => { if(STATE.pinHash === null) STATE.pinHash = ''; });

  translateAll();
  STATE.ready = true;
  /* நாள் மாறினா alarm திரும்ப check ஆகணும் */
  setInterval(() => { if(STATE.unlocked) refreshAlarm(); }, 60*60*1000);
})();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

</script>
</body>
</html>
